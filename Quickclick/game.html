<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Click - Game</title>
    <link rel="stylesheet" href="Styleqc.css">
  </head>
  <body class="game-body">
    <header class="game-header">
      <section class="game-stat">
        <p class="combo">Combo: x2</p>
        <p class="score">Score: 0</p>
      </section>

      <section class="game-timer">
        <p>Time</p>
        <p class="timer">00:30</p>
      </section>

      <section class="game-stat">
        <p class="tries">Try: 5</p>
        <p>Level: <span class="level">1</span></p>
      </section>
    </header>

    <main class="game-canvas" aria-label="Game canvas">
      <div class="countdown" aria-live="assertive">5</div>
      <section class="game-over" hidden aria-live="assertive">
        <h1>Game Over</h1>
        <p class="final-score">Score: 0</p>
        <p class="final-highscore">Highscore: 0</p>
        <button class="restart-button" type="button">Opnieuw</button>
        <button class="menu-button" type="button">Menu</button>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>
    <script src="game.js"></script>
  </body>
</html>
