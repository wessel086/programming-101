<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Click - Game</title>
    <link rel="stylesheet" href="styleqc.css" />
  </head>
  <body class="game-body">

    <header class="game-header">
      <a href="Home.html" class="home-btn">&#8592; Home</a>

      <div class="game-stat">
        <p class="combo">Combo: x2</p>
        <p class="score">Score: 0</p>
      </div>

      <div class="game-stat game-timer">
        <p>&#9201; Time</p>
        <p class="timer">00:30</p>
      </div>


  <div class="game-stat game-stat-right">
  <p class="level">Level: 1</p>
</div>

      <!-- Lege kolom rechts zodat de timer exact in het midden staat -->

    </header>

    <main>
      <div class="game-canvas">
        <div class="countdown">5</div>
        <div class="game-over">
          <h1>Game Over</h1>
          <p class="final-score">Score: 0</p>
          <p class="final-highscore">Highscore: 0</p>
          <button class="restart-button">Opnieuw</button>
          <button class="menu-button">Menu</button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
    <script src="game.js"></script>

  </body>
</html>
