<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Click</title>
    <link rel="stylesheet" href="styleqc.css">
  </head>
  <body>

    <header>
      <h1>Quick Click</h1>
      <p>Stay alive and shoot all the circles!</p>
    </header>

    <main>
      <aside class="left"></aside>

      <section class="middle">
        <div class="start-screen">
          <p class="highscore">Highscore: 0</p>
          <input type="text" class="name-input" placeholder="Your name...">
          <div class="level-select">
            <button class="level-btn" data-level="1">Level 1</button>
            <button class="level-btn" data-level="2">Level 2</button>
            <button class="level-btn" data-level="3">Level 3</button>
            <button class="level-btn" data-level="4">Level 4</button>
          </div>
          <button class="start-btn">START GAME</button>
        </div>
      </section>

      <aside class="right"></aside>
    </main>

    <footer>
      <p>Wessel - QuickClick</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>
    <script src="quickclick.js"></script>
  </body>
</html>
