<!doctype html>
<html lang="nl">
  <head>
    <!-- Tekenset instellen op UTF-8 zodat speciale tekens goed worden weergegeven -->
    <meta charset="UTF-8" />
    <!-- Zorgt dat de pagina goed schaalt op mobiele schermen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Click</title>
    <!-- Koppeling naar het externe CSS-bestand -->
    <link rel="stylesheet" href="styleqc.css" />
  </head>
  <body>

    <!-- Bovenbalk met de naam van het spel en ondertitel -->
    <header class="page-header">
      <h1>Quick Click</h1>
      <p>Blijf levend en schiet alle cirkels!</p>
    </header>

    <main>

      <!-- Linker kolom: speluitleg en bonussen -->
      <aside class="side-column left-column" aria-label="Speluitleg">
        <section class="info-panel">
          <h2>Controls</h2>
          <p>Klik op de cirkels om punten te verdienen.</p>
          <img
            class="muis"
            src="fotos/muis.png"
            alt="Linker muisknop"
            title="Klik op de cirkel met de linker muisknop"
          />
        </section>
        <section class="info-panel bonus-panel">
          <h2>Bonussen</h2>
          <ul>
            <li>
              <span class="bonus-dot gold-dot"></span>
              <span>Gold target</span>
              <strong>+5 punten</strong>
            </li>
            <li>
              <span class="bonus-dot green-dot"></span>
              <span>Time target</span>
              <strong>+3 seconden</strong>
            </li>
            <li>
              <span class="bonus-dot gray-dot"></span>
              <span>Mis een target</span>
              <strong>−2 seconden</strong>
            </li>
          </ul>
        </section>
      </aside>

      <!-- Midden: startscherm -->
      <section class="middle">
        <section class="start-screen">
          <label class="name-label" for="player-name">Naam invoeren</label>
          <input
            id="player-name"
            type="text"
            class="name-input"
            placeholder="Jouw naam..."
            autocomplete="name"
          />
          <div class="level-select">
            <p>Kies je level</p>
            <button class="level-btn" data-level="1">Level 1</button>
            <button class="level-btn" data-level="2">Level 2</button>
            <button class="level-btn" data-level="3">Level 3</button>
            <button class="level-btn" data-level="4">Level 4</button>
          </div>
          <!-- Startknop, uitgeschakeld totdat naam en level zijn ingevuld -->
          <button class="start-btn" disabled>Start game</button>
          <p class="highscore">Highscore: 0</p>
        </section>
      </section>

      <!-- Rechter kolom: eerdere scores -->
      <aside class="side-column right-column" aria-label="Eerdere scores">
        <section class="info-panel score-panel">
          <h2>🏆 Previous scores</h2>
          <p class="panel-empty">Je scores verschijnen hier.</p>
        </section>
      </aside>

    </main>

    <!-- Onderbalk met naam van de maker -->
    <footer class="page-footer">
      <p>Wessel - QuickClick</p>
    </footer>

    <!-- p5.js bibliotheek voor het canvas -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>
    <!-- Eigen spellogica -->
    <script src="quickclick.js"></script>

  </body>
</html>
