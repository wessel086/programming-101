<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Click</title>
    <link rel="stylesheet" href="styleqc.css">
  </head>
  <body>

    <header>
      <h1>Quick Click</h1>
      <p>Blijf levend en schiet alle cirkels!</p>
    </header>

    <main>
      <aside class="links"></aside>

      <section class="midden">
        <div class="startscherm">
          <p class="highscore">Highscore: 0</p>
          <input type="text" class="naamInvoer" placeholder="Jouw naam...">
          <div class="levelKeuze">
            <button class="levelKnop" data-level="1">Level 1</button>
            <button class="levelKnop" data-level="2">Level 2</button>
            <button class="levelKnop" data-level="3">Level 3</button>
            <button class="levelKnop" data-level="4">Level 4</button>
          </div>
          <button class="startKnop">START GAME</button>
        </div>
      </section>

      <aside class="rechts"></aside>
    </main>

    <footer>
      <p>Wessel - QuickClick</p>
    </footer>

    <script src="quickclick.js"></script>
  </body>
</html>
